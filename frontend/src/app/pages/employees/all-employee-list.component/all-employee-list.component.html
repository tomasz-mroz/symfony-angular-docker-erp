<div class="card" *ngIf="employeeData$ | async as response">
  <p-table
    [value]="response.items"
    [paginator]="true"
    [rows]="response.pagination.pageSize"
    [totalRecords]="response.pagination.total"
    [responsiveLayout]="'scroll'"
    dataKey="uuid"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="firstName">Imię <p-sortIcon field="firstName" /></th>
        <th pSortableColumn="lastName">Nazwisko <p-sortIcon field="lastName" /></th>
        <th pSortableColumn="email">Email <p-sortIcon field="email" /></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-employee>
      <tr>
        <td>{{ employee.firstName }}</td>
        <td>{{ employee.lastName }}</td>
        <td>
          <a
            class="employee-link"
            [routerLink]="['/pracownicy/szczegoly', employee.uuid]"
          >
            {{ employee.email }}
          </a>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center p-4">Brak pracowników do wyświetlenia.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
