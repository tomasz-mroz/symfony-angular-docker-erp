<div class="card" *ngIf="employeeData$ | async as response">
  <p-table
    [value]="response.items"
    [paginator]="true"
    [rows]="response.pagination.pageSize"
    [totalRecords]="response.pagination.total"
    [responsiveLayout]="'scroll'">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="firstName">Imię <p-sortIcon field="firstName"></p-sortIcon></th>
        <th pSortableColumn="lastName">Nazwisko <p-sortIcon field="lastName"></p-sortIcon></th>
        <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-employee>
      <tr>
        <td>{{ employee.first_name }}</td>
        <td>{{ employee.last_name }}</td>
        <td>{{ employee.email }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center p-4">Brak pracowników do wyświetlenia.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
